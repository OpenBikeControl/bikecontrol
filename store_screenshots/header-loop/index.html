<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline","default":"Virtual shifting for any smart trainer.\nShift from your handlebars."},
    {"id":"ofMax","type":"string","label":"Gear count line","default":"of 24"},
    {"id":"trainer","type":"string","label":"Trainer name","default":"Smart Trainer"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=1646" />
    <script src="assets/js/gsap-3.14.2.min.js"></script>
    <script src="assets/js/drivetrain-geometry.js"></script>
    <script src="assets/js/drivetrain.js"></script>
    <style>
      /* App Store product page header loop. The brand band of the app
         (lib/widgets/ui/bk_brand_band.dart) laid out for the iPhone crop of
         the header, measured on a live product page (iOS, 440 pt wide):
           - visible:      x 647–3193, full height (≈5.78 px per pt)
           - status bar:   y 0–305; Dynamic Island x 1554–2284, y 64–277
           - back button:  x 749–1026, y 395–667
           - mute / share: x 2464–3089, y 395–667
         Copy and card sit below the floating buttons, ~44 pt in from each
         side (x 900–2941). The black pill at the top wraps the Dynamic
         Island like a compact Live Activity: the ± badge left, the gear
         right, both outside x 1521–2319 (the island on a 402 pt iPhone). */
      @font-face {
        font-family: "Barlow Condensed";
        src: url("assets/fonts/BarlowCondensed-ExtraBold.ttf");
        font-weight: 800;
      }
      :root {
        --band-start: #0e74b7;
        --band-end: #0b7478;
        --contour: rgba(255, 255, 255, 0.16);
        --card: #1b1f25;
        --card-raised: #2a2e35;
        --secondary-ink: #a3a3a3;
        --lifted: #4da9e8;
        --on-lifted: #04121c;
        --success: #22c55e;
        --island: #000;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 3840px;
        height: 1646px;
        overflow: hidden;
        background: var(--band-start);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, var(--band-start) 0%, var(--band-end) 100%);
      }
      .contours {
        position: absolute;
        overflow: visible;
        fill: none;
        stroke: var(--contour);
      }
      #contours-a {
        right: -700px;
        top: -560px;
        width: 2700px;
        height: 1980px;
      }
      #contours-b {
        left: -760px;
        bottom: -900px;
        width: 2200px;
        height: 1610px;
      }

      /* Rolling digits: the outgoing gear leaves, the new one arrives. */
      .roll {
        position: relative;
        overflow: hidden;
      }
      .roll span {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-feature-settings: "tnum";
      }

      /* ---- Dynamic Island (compact Live Activity) ------------------------ */
      #island {
        position: absolute;
        left: 1400px;
        top: 46px;
        width: 1040px;
        height: 270px;
        border-radius: 135px;
        background: var(--island);
      }
      #isl-badge {
        position: absolute;
        left: 28px;
        top: 95px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(120deg, var(--band-start), var(--band-end));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #isl-badge svg {
        width: 48px;
        height: 48px;
      }
      #isl-gear {
        position: absolute;
        right: 36px;
        top: 85px;
        width: 120px;
        height: 100px;
      }
      #isl-gear span {
        text-align: right;
        font-size: 92px;
        line-height: 100px;
        color: var(--lifted);
      }

      /* ---- Copy ---------------------------------------------------------- */
      #headline-box {
        position: absolute;
        left: 900px;
        top: 770px;
        width: 880px;
        height: 600px;
        display: flex;
        align-items: center;
      }
      #headline {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 160px;
        line-height: 0.95;
        text-transform: uppercase;
        color: #fff;
        white-space: pre-line;
        text-wrap: balance;
      }

      /* ---- Drivetrain card (authored at 816×386, shown at 1.3×) ---------- */
      #card-host {
        position: absolute;
        left: 1880px;
        top: 819px;
        width: 816px;
        height: 386px;
        transform: scale(1.3);
        transform-origin: 0 0;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 34px 86px rgba(4, 18, 28, 0.45);
        font-family: Inter, sans-serif;
        color: #fff;
      }
      #card-label {
        position: absolute;
        left: 26px;
        top: 22px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--secondary-ink);
      }
      #card-label i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--success);
      }
      #dt {
        position: absolute;
        left: 22px;
        top: 70px;
        width: 590px;
        height: 258px;
        overflow: visible;
      }
      #gear-col {
        position: absolute;
        right: 22px;
        top: 50px;
        width: 150px;
        height: 314px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }
      .shift-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #btn-down {
        background: var(--card-raised);
      }
      #btn-up {
        background: var(--lifted);
      }
      .shift-btn svg {
        width: 28px;
        height: 28px;
      }
      #gear-readout {
        text-align: center;
      }
      #gear-number {
        width: 150px;
        height: 100px;
      }
      #gear-number span {
        text-align: center;
        font-size: 108px;
        line-height: 100px;
      }
      #gear-of {
        margin-top: 4px;
        font-size: 18px;
        color: var(--secondary-ink);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="3840" data-height="1646" data-fps="30">
      <div id="ground" data-layout-ignore></div>
      <svg id="contours-a" class="contours" viewBox="0 0 300 220" data-layout-ignore></svg>
      <svg id="contours-b" class="contours" viewBox="0 0 300 220" data-layout-ignore></svg>

      <div id="island" data-layout-ignore>
        <div id="isl-badge">
          <svg viewBox="0 0 24 24"><path d="M12 5.5v7M8.5 9h7M8.5 17.5h7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" /></svg>
        </div>
        <div id="isl-gear" class="roll"><span>12</span><span>12</span></div>
      </div>

      <div id="headline-box">
        <p id="headline" data-var-text="headline">Virtual shifting for any smart trainer.
Shift from your handlebars.</p>
      </div>

      <div id="card-host" data-layout-allow-overflow>
        <div id="card">
          <div id="card-label" data-layout-ignore><i></i><span id="card-trainer" data-var-text="trainer">Smart Trainer</span></div>
          <svg id="dt" data-layout-allow-overflow data-layout-ignore></svg>
          <div id="gear-col">
            <div id="btn-down" class="shift-btn">
              <svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round" /></svg>
            </div>
            <div id="gear-readout">
              <div id="gear-number" class="roll"><span>12</span><span>12</span></div>
              <div id="gear-of" data-var-text="ofMax" data-layout-ignore>of 24</div>
            </div>
            <div id="btn-up" class="shift-btn">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#04121c" stroke-width="2.4" stroke-linecap="round" /></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const LOOP = 10;
        const G = window.BKGeometry;

        // Copy from the render's variables (one row per store language).
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        if (vars.headline) document.getElementById("headline").textContent = vars.headline;
        if (vars.ofMax) document.getElementById("gear-of").textContent = vars.ofMax;
        if (vars.trainer) document.getElementById("card-trainer").textContent = vars.trainer;

        // The headline takes the largest size that fits its box in every language.
        const box = document.getElementById("headline-box");
        const headline = document.getElementById("headline");
        const maxH = box.clientHeight;
        const maxW = box.clientWidth;
        let size = 176;
        headline.style.fontSize = size + "px";
        while ((headline.getBoundingClientRect().height > maxH || headline.scrollWidth > maxW) && size > 70) {
          size *= 0.98;
          headline.style.fontSize = size + "px";
        }

        // BkContourPainter's nine nested terrain lines (lib/widgets/ui/bk_brand_band.dart).
        function contourPaths() {
          let out = "";
          for (let k = 0; k < 9; k++) {
            const pts = [];
            const radius = 18 + k * 15;
            for (let s = 0; s <= 72; s++) {
              const t = (s / 72) * Math.PI * 2;
              const r = radius * (1 + 0.1 * Math.sin(3 * t + k * 0.45) + 0.06 * Math.sin(5 * t - k * 0.3) + 0.03 * Math.sin(7 * t + k));
              pts.push((190 + Math.cos(t) * r * 1.25).toFixed(2) + "," + (110 + Math.sin(t) * r * 0.9).toFixed(2));
            }
            out += '<path vector-effect="non-scaling-stroke" stroke-width="5" d="M' + pts.join("L") + 'Z"/>';
          }
          return out;
        }
        for (const id of ["contours-a", "contours-b"]) document.getElementById(id).innerHTML = contourPaths();

        // The drivetrain: 34T chainring with the 50T ghost ring, gear 12 of 24.
        const dt = window.BKDrivetrain.createDrivetrain(document.getElementById("dt"), { prefix: "hdr" });
        const s = dt.state;
        s.gearCount = 24;
        s.gear = 12;
        s.rRear = G.rearRadius(12, 24);
        s.frontShift = 1;
        s.largeRing = 0;
        s.smallTeeth = 34;
        s.largeTeeth = 50;
        s.rFront = 34 * G.TOOTH_PX;
        s.pulse = 1;
        s.travel = 0;
        s.linkTravel = 0;
        dt.render();

        // Four shifts: up, up, down, down — back on gear 12 well before the loop ends.
        const shifts = [
          { at: 1.6, to: 13, btn: "#btn-up" },
          { at: 3.2, to: 14, btn: "#btn-up" },
          { at: 6.0, to: 13, btn: "#btn-down" },
          { at: 7.6, to: 12, btn: "#btn-down" },
        ];

        // Readouts are pure functions of timeline time, so any seek (and the
        // loop seam) shows the right digits in the right place.
        const ROLL = 0.42;
        const rollEase = gsap.parseEase("power3.inOut");
        const rollers = ["isl-gear", "gear-number"].map((id) => {
          const el = document.getElementById(id);
          return { out: el.children[0], in: el.children[1], h: el.clientHeight };
        });
        const badge = document.getElementById("isl-badge");

        const tl = gsap.timeline({ paused: true });
        const paint = () => {
          dt.render();
          const t = tl.time();
          let from = 12;
          let to = 12;
          let since = Infinity;
          let prev = 12;
          for (const sh of shifts) {
            if (t >= sh.at) {
              from = prev;
              to = sh.to;
              since = t - sh.at;
            }
            prev = sh.to;
          }
          const p = Math.min(1, since / ROLL);
          const e = rollEase(p);
          const dir = to > from ? 1 : to < from ? -1 : 0;
          for (const r of rollers) {
            r.out.textContent = String(from);
            r.in.textContent = String(to);
            // Up: digits roll upward (the new gear comes from below); down: the reverse.
            r.out.style.transform = "translateY(" + (-dir * r.h * e).toFixed(2) + "px)";
            r.out.style.opacity = dir === 0 ? 0 : (1 - e).toFixed(3);
            r.in.style.transform = "translateY(" + (dir * r.h * (1 - e)).toFixed(2) + "px)";
            r.in.style.opacity = dir === 0 ? 1 : e.toFixed(3);
          }
          // The badge answers each press with a short pulse.
          const k = since < 0.4 ? Math.sin((since / 0.4) * Math.PI) : 0;
          badge.style.transform = "scale(" + (1 + 0.14 * k).toFixed(4) + ")";
        };

        // Pedalling at a steady cadence. 2832.7 px of chain over the loop turns
        // the 5-spoke crank and the 4-armed cassette (at gear 12) a whole number
        // of their symmetry periods to within 0.2°, so the loop has no seam; the
        // link pattern runs on travel rounded to whole links (2832 = 354 × 8).
        tl.fromTo(s, { travel: 0, linkTravel: 0 }, { travel: 2832.7, linkTravel: 2832, duration: LOOP, ease: "none", onUpdate: paint }, 0);

        // Terrain drift on a closed path: the contours return to where they began.
        const drift = { p: 0 };
        const a = document.getElementById("contours-a");
        const b = document.getElementById("contours-b");
        tl.fromTo(drift, { p: 0 }, {
          p: 1, duration: LOOP, ease: "none",
          onUpdate: () => {
            const t = drift.p * Math.PI * 2;
            gsap.set(a, { x: Math.sin(t) * 46, y: (1 - Math.cos(t)) * 22, rotation: Math.sin(t) * 1.2 });
            gsap.set(b, { x: -Math.sin(t) * 38, y: -(1 - Math.cos(t)) * 18, rotation: -Math.sin(t) * 1.0 });
          },
        }, 0);

        let from = 12;
        for (const sh of shifts) {
          const press = sh.at - 0.16;
          // The controller press on the card's button.
          tl.fromTo(sh.btn, { scale: 1 }, { scale: 0.86, duration: 0.12, ease: "power2.out" }, press);
          tl.fromTo(sh.btn, { scale: 0.86 }, { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, press + 0.12);
          // The chain moves to the next cog, then the cog ripples where it lands.
          tl.fromTo(s, { rRear: G.rearRadius(from, 24) }, { rRear: G.rearRadius(sh.to, 24), duration: 0.42, ease: "power3.out", immediateRender: false, onUpdate: paint }, sh.at);
          tl.fromTo(s, { pulse: 0 }, { pulse: 1, duration: 0.5, ease: "none", immediateRender: false, onUpdate: paint }, sh.at + 0.18);
          from = sh.to;
        }

        paint();
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

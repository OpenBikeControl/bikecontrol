dependency_overrides:
  # 3.1.0 + Windows fixes: closes failed connect attempts (a rebooting Click V2 froze
  # the window, upstream PR Navideck/universal_ble#358) and refreshes GATT services
  # off the UI thread (GattDeviceService::Close hang in Store crash reports).
  # + Apple: queues notifications CoreBluetooth refuses (transmit queue full) and
  # resends them when it is ready, so a release sent right after its press is not
  # lost (#417).
  # + Windows: connect attempts run off the UI thread, so a stalled Bluetooth
  # service while a controller reboots (Click V2 left side) no longer hangs the
  # window (MoAppHangXProc waiting on svchost).
  # Drop once a release contains all of them.
  universal_ble:
    git:
      url: https://github.com/jonasbark/universal_ble.git
      ref: b87bf636cb04ab37ca3dad1f3a3e30fdf8c9d9c3
  path_provider_foundation: ">=2.3.0 <2.6.0"
  gamepads_windows:
    path: packages/gamepads_windows
  gamepads_darwin:
    path: packages/gamepads_darwin
  # Vendored: DNS callbacks are handled on the platform thread and never throw
  # (a stopped discovery crashed in its browse callback in Store crash reports).
  nsd_windows:
    path: packages/nsd_windows
  # Vendored: native errors from the toast API no longer end the app.
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows
  prop:
    path: prop

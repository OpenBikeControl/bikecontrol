dependency_overrides:
  # 3.1.0 + Windows fixes: closes failed connect attempts (a rebooting Click V2 froze
  # the window, upstream PR Navideck/universal_ble#358) and refreshes GATT services
  # off the UI thread (GattDeviceService::Close hang in Store crash reports).
  # + Apple: queues notifications CoreBluetooth refuses (transmit queue full) and
  # resends them when it is ready, so a release sent right after its press is not
  # lost (#417). Drop once a release contains all of them.
  universal_ble:
    git:
      url: https://github.com/jonasbark/universal_ble.git
      ref: f0fcdd3bce85723868c0cc064cd427af50906de9
  path_provider_foundation: ">=2.3.0 <2.6.0"
  gamepads_windows:
    path: packages/gamepads_windows
  gamepads_darwin:
    path: packages/gamepads_darwin
  prop:
    path: prop

name: flutter_local_notifications_windows
description: Windows implementation of the flutter_local_notifications plugin
version: 3.1.1
publish_to: none

# Vendored from pub.dev flutter_local_notifications_windows 3.1.1 (4.0.1 has the
# same native code). BikeControl change: every FFI function catches native
# exceptions, so a WinRT error from the toast API (notifications turned off,
# platform unavailable, ...) reports failure instead of ending the app
# (FAIL_FAST_FATAL_APP_EXIT in Store crash reports 7.5.0).
homepage: https://github.com/MaikuB/flutter_local_notifications/tree/master/flutter_local_notifications_windows
issue_tracker: https://github.com/MaikuB/flutter_local_notifications/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  flutter_local_notifications_platform_interface: ^12.0.0
  meta: ^1.11.0
  timezone: ^0.11.0
  xml: ">=6.5.0 <8.0.0"

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.25.2

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        ffiPlugin: true
        dartPluginClass: FlutterLocalNotificationsWindows
